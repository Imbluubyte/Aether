name: Android
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install NDK + CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build editor + standalone player (bullet heaven demo)
        working-directory: android
        run: gradle :editor:assembleDebug :player:assembleDebug -PgameDir=../../games/bullet_heaven
      - uses: actions/upload-artifact@v4
        with:
          name: aether-apks
          path: |
            android/editor/build/outputs/apk/debug/*.apk
            android/player/build/outputs/apk/debug/*.apk
